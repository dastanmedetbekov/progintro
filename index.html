<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d1117;
    --panel: #12161c;
    --border: #232a33;
    --text: #e6edf3;
    --dim: #7d8590;
    --green: #3fb950;
    --green-dim: rgba(63,185,80,0.12);
    --radius: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
    font-size:14px;
    line-height:1.5;
    padding:48px 32px 90px;
  }
  .wrap{max-width:1100px;margin:0 auto;}

  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;}
  h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-0.01em;}

  button{
    font-family:inherit;
    font-weight:500;
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 16px;
    font-size:13px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  button:hover{border-color:#3a4451;background:#161b22;}
  button:disabled{opacity:0.4;cursor:default;}

  .stats{
    display:grid;
    grid-template-columns: 1fr 1fr 200px;
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:20px;
  }
  .stat{background:var(--panel);padding:22px 24px;}
  .stat .label{color:var(--dim);font-size:11px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px;}
  .stat .value{font-size:32px;font-weight:600;letter-spacing:-0.01em;}
  .stat .value.green{color:var(--green);}
  .ring-cell{display:flex;align-items:center;justify-content:center;gap:14px;}
  .ring{position:relative;width:72px;height:72px;flex:none;}
  .ring svg{transform:rotate(-90deg);width:72px;height:72px;}
  .ring circle{fill:none;stroke-width:6;}
  .ring .bg{stroke:var(--border);}
  .ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .6s ease;}
  .ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
  .panel h2{font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:var(--dim);margin:0 0 20px;font-weight:600;}
  .chart{display:flex;align-items:flex-end;gap:6px;height:140px;overflow-x:auto;}
  .bar-col{flex:1 0 44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:44px;}
  .bar-track{width:14px;flex:1;display:flex;align-items:flex-end;}
  .bar-fill{width:100%;background:var(--green);border-radius:3px 3px 1px 1px;min-height:2px;transition:height .5s ease;}
  .bar-pct{font-size:10px;color:var(--dim);margin-bottom:6px;white-space:nowrap;}
  .bar-label{font-size:9px;color:var(--dim);margin-top:10px;text-align:center;line-height:1.3;max-width:60px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .card{background:var(--panel);padding:18px 20px;}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .card .name{font-size:13px;font-weight:500;}
  .card .frac{font-size:12px;color:var(--dim);}
  .card .frac .done{color:var(--green);font-weight:600;}
  .bar-bg{height:4px;background:var(--border);border-radius:2px;margin:12px 0 10px;overflow:hidden;}
  .bar-bg .fill{height:100%;background:var(--green);border-radius:2px;}
  .card .pct{font-size:12px;color:var(--dim);}
  .card.empty{opacity:0.4;}

  footer{margin-top:24px;color:var(--dim);font-size:12px;text-align:right;}
  footer b{color:var(--text);}

  .hidden{display:none !important;}
  .center-msg{padding:80px 20px;text-align:center;color:var(--dim);border:1px solid var(--border);border-radius:var(--radius);}
  .err{border:1px solid #f85149;color:#ffa198;background:rgba(248,81,73,0.08);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;font-size:12px;white-space:pre-wrap;font-family:ui-monospace,monospace;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Task Progress</h1>
    <button id="rescanBtn">Rescan</button>
  </header>

  <div id="err" class="err hidden"></div>
  <div id="loading" class="center-msg">Scanning…</div>

  <div id="app" class="hidden">

    <div class="stats">
      <div class="stat">
        <div class="label">Completed</div>
        <div class="value green" id="statDone">0</div>
      </div>
      <div class="stat">
        <div class="label">Total</div>
        <div class="value" id="statTotal">0</div>
      </div>
      <div class="stat ring-cell">
        <div class="ring">
          <svg viewBox="0 0 72 72">
            <circle class="bg" cx="36" cy="36" r="30"></circle>
            <circle class="fg" id="ringFg" cx="36" cy="36" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5"></circle>
          </svg>
          <div class="ring-pct" id="ringPct">0%</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>By section</h2>
      <div class="chart" id="chart"></div>
    </div>

    <div class="grid" id="grid"></div>

    <footer>Total: <b id="footTotal">0</b> tasks across <b id="footSections">0</b> sections</footer>
  </div>

</div>

<script>
const SECTIONS = [
  "01.FirstStep","02.Pascal","03.Assembly","04.C",
  "05.OperationSystem","06.Networks","07.Parallel","08.Kernel",
  "09.Paradigms","10.Cpp","11.UndestrParadigms","12.Scripting"
];

const errEl = document.getElementById('err');
const loadingEl = document.getElementById('loading');
const appEl = document.getElementById('app');
const rescanBtn = document.getElementById('rescanBtn');

async function listDir(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + url);
  const text = await res.text();
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const hrefs = Array.from(doc.querySelectorAll('a'))
    .map(a => a.getAttribute('href') || '')
    .filter(h => h && h !== '../' && h !== '/' && !h.startsWith('?') && !h.startsWith('http') && !h.startsWith('mailto:'));
  return hrefs.map(h => decodeURIComponent(h));
}

async function scanDir(path) {
  const entries = await listDir(path);
  const files = entries.filter(e => !e.endsWith('/'));
  const dirs = entries.filter(e => e.endsWith('/'));

  const hasReadme = files.includes('README.md');
  const hasCheck = files.includes('CHECK');

  let total = 0, completed = 0;
  if (hasReadme || hasCheck) {
    total = 1;
    if (hasCheck) completed = 1;
  }
  for (const d of dirs) {
    const sub = await scanDir(path + d);
    total += sub.total;
    completed += sub.completed;
  }
  return { total, completed };
}

async function run() {
  loadingEl.classList.remove('hidden');
  errEl.classList.add('hidden');
  appEl.classList.add('hidden');
  rescanBtn.disabled = true;

  try {
    const results = {};
    for (const name of SECTIONS) {
      results[name] = await scanDir(name + '/');
    }
    render(results);
    loadingEl.classList.add('hidden');
    appEl.classList.remove('hidden');
  } catch (e) {
    loadingEl.classList.add('hidden');
    errEl.classList.remove('hidden');
    errEl.textContent =
      'Could not read folders: ' + e.message + '\n\n' +
      'Run a local server in this folder:\n\n' +
      '  python3 -m http.server 8000\n\n' +
      'then open http://localhost:8000';
  } finally {
    rescanBtn.disabled = false;
  }
}

function render(results) {
  let grandTotal = 0, grandDone = 0;
  SECTIONS.forEach(n => { grandTotal += results[n].total; grandDone += results[n].completed; });
  const grandPct = grandTotal ? (grandDone / grandTotal * 100) : 0;

  document.getElementById('statDone').textContent = grandDone;
  document.getElementById('statTotal').textContent = grandTotal;
  document.getElementById('ringPct').textContent = grandPct.toFixed(1) + '%';
  const circumference = 188.5;
  document.getElementById('ringFg').style.strokeDashoffset = circumference - (circumference * grandPct / 100);

  document.getElementById('footTotal').textContent = grandTotal;
  document.getElementById('footSections').textContent = SECTIONS.length;

  const chart = document.getElementById('chart');
  chart.innerHTML = '';
  SECTIONS.forEach(n => {
    const r = results[n];
    const pct = r.total ? (r.completed / r.total * 100) : 0;
    const col = document.createElement('div');
    col.className = 'bar-col';
    col.innerHTML = `
      <div class="bar-pct">${r.total ? pct.toFixed(0) + '%' : '—'}</div>
      <div class="bar-track"><div class="bar-fill" style="height:${pct}%"></div></div>
      <div class="bar-label">${n}</div>
    `;
    chart.appendChild(col);
  });

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  SECTIONS.forEach(n => {
    const r = results[n];
    const pct = r.total ? (r.completed / r.total * 100) : 0;
    const card = document.createElement('div');
    card.className = 'card' + (r.total === 0 ? ' empty' : '');
    card.innerHTML = `
      <div class="top">
        <div class="name">${n}</div>
        <div class="frac"><span class="done">${r.completed}</span> / ${r.total}</div>
      </div>
      <div class="bar-bg"><div class="fill" style="width:${pct}%"></div></div>
      <div class="pct">${r.total ? pct.toFixed(1) + '%' : 'no tasks'}</div>
    `;
    grid.appendChild(card);
  });
}

rescanBtn.addEventListener('click', run);
run();
</script>
</body>
</html>
